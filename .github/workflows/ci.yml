name: Workline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Safety Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install -e ".[dev]"

      - name: Run pytest test suite (Backend & CLI)
        run: |
          python -m pytest tests cli/tests -v --tb=short 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONPATH: .

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

      - name: Run typecheck
        run: |
          npm run typecheck

      - name: Run lint
        run: |
          npm run lint

      - name: Build frontend
        run: |
          npm run build 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_bW9yYWwtcHVwLTkxLmNsZXJrLmFjY291bnRzLmRldiQ' }}
