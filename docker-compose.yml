version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Authoritative Engineering State: SurrealDB Multi-Model Graph
  # --------------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v2.0.4
    container_name: workline-surrealdb
    command: start --bind 0.0.0.0:8000 --user root --pass root file:/data/workline.db
    ports:
      - "8001:8000"
    volumes:
      - surreal_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Authoritative Vector Retrieval: Qdrant Vector Engine
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: workline-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Ephemeral Cache & Live SSE Pub/Sub Broker: Redis
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workline-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Workline API / BFF Gateway (FastAPI)
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: workline-api
    ports:
      - "8000:8000"
    environment:
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=root
      - SURREALDB_PASSWORD=root
      - SURREALDB_NAMESPACE=workline
      - SURREALDB_DATABASE=workline
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - WORKLINE_ALLOW_DEV_AUTH=true
      - WORKLINE_ARTIFACTS_BUCKET=workline-artifacts
    depends_on:
      surrealdb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Workline Agent Worker Pool (ECS Fargate Worker Emulation)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: workline-worker
    environment:
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=root
      - SURREALDB_PASSWORD=root
      - SURREALDB_NAMESPACE=workline
      - SURREALDB_DATABASE=workline
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - WORKLINE_ALLOW_DEV_AUTH=true
    depends_on:
      surrealdb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  surreal_data:
    name: workline_surreal_data
  qdrant_data:
    name: workline_qdrant_data
