services:
  # ============================================================================
  # R1: Workline Core & API Gateway
  # ============================================================================
  - type: web
    name: workline-core-gateway
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/database
    envVars:
      - key: PORT
        value: 10000
      - key: WORKLINE_SURREALDB_HOST
        fromService:
          type: web
          name: workline-surrealdb
          property: host
      - key: WORKLINE_QDRANT_HOST
        fromService:
          type: web
          name: workline-qdrant
          property: host

  # ============================================================================
  # R5: Workline Procurement & Collaboration Service (First Extracted Service)
  # ============================================================================
  - type: web
    name: workline-procurement-service
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.services.procurement.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10005
