services:
  # ============================================================================
  # R1: Workline Core & API Gateway (Docker Containerized)
  # ============================================================================
  - type: web
    name: workline-core-gateway
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: WORKLINE_CORS_ORIGINS
        value: "https://worklineai.netlify.app,http://localhost:3000"
      - key: WORKLINE_R2_URL
        value: http://workline-ai-agents:10002
      - key: R2_INTERNAL_URL
        value: http://workline-ai-agents:10002
      - key: R2_SERVICE_TOKEN
        sync: false
      - key: WORKLINE_R3_URL
        value: http://workline-knowledge-documents:10003
      - key: WORKLINE_R4_URL
        value: http://workline-engineering-simulation:10004
      - key: WORKLINE_R5_URL
        value: http://workline-procurement-service:10005

  # ============================================================================
  # R2: Workline AI & Research Agents Service (Docker Containerized)
  # ============================================================================
  - type: web
    name: workline-ai-agents
    env: docker
    dockerfilePath: backend/r2/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10002
      - key: WORKLINE_ENV
        value: production
      - key: R2_SERVICE_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ============================================================================
  # R3: Workline Knowledge & Documents Service
  # ============================================================================
  - type: web
    name: workline-knowledge-documents
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.services.knowledge.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10003

  # ============================================================================
  # R4: Workline Engineering & Simulation Service
  # ============================================================================
  - type: web
    name: workline-engineering-simulation
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.services.engineering.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10004

  # ============================================================================
  # R5: Workline Procurement & Collaboration Service
  # ============================================================================
  - type: web
    name: workline-procurement-service
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.services.procurement.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10005
