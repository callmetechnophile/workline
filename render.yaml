services:
  # ============================================================================
  # R1: Workline Core & API Gateway (Docker Containerized)
  # ============================================================================
  - type: web
    name: workline-core-gateway
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: WORKLINE_CORS_ORIGINS
        value: "https://worklineai.netlify.app,http://localhost:3000"
      - key: WORKLINE_R2_URL
        value: http://workline-ai-agents:10002
      - key: R2_INTERNAL_URL
        value: http://workline-ai-agents:10002
      - key: R2_SERVICE_TOKEN
        sync: false
      - key: WORKLINE_R3_URL
        value: http://workline-knowledge-documents:10003
      - key: R3_INTERNAL_URL
        value: http://workline-knowledge-documents:10003
      - key: R3_SERVICE_TOKEN
        sync: false
      - key: WORKLINE_R4_URL
        value: http://workline-engineering-simulation:10004
      - key: R4_INTERNAL_URL
        value: http://workline-engineering-simulation:10004
      - key: R4_SERVICE_TOKEN
        sync: false
      - key: WORKLINE_R5_URL
        value: http://workline-procurement-service:10005
      - key: R5_INTERNAL_URL
        value: http://workline-procurement-service:10005
      - key: R5_SERVICE_TOKEN
        sync: false

  # ============================================================================
  # R2: Workline AI & Research Agents Service (Docker Containerized)
  # ============================================================================
  - type: web
    name: workline-ai-agents
    env: docker
    dockerfilePath: backend/r2/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10002
      - key: WORKLINE_ENV
        value: production
      - key: R2_SERVICE_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ============================================================================
  # R3: Workline Knowledge & Documents Service (Docker Containerized)
  # ============================================================================
  - type: web
    name: workline-knowledge-documents
    env: docker
    dockerfilePath: backend/r3/Dockerfile
    dockerContext: .
    region: oregon
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10003
      - key: WORKLINE_ENV
        value: production
      - key: R3_SERVICE_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SURREALDB_URL
        sync: false
      - key: SURREALDB_USER
        sync: false
      - key: SURREALDB_PASSWORD
        sync: false

  # ============================================================================
  # R4: Workline Engineering & Simulation Service (Docker Containerized)
  # ============================================================================
  - type: web
    name: workline-engineering-simulation
    env: docker
    dockerfilePath: backend/r4/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10004
      - key: WORKLINE_ENV
        value: production
      - key: R4_SERVICE_TOKEN
        sync: false
      - key: R3_INTERNAL_URL
        value: http://workline-knowledge-documents:10003
      - key: R3_SERVICE_TOKEN
        sync: false

  # ============================================================================
  # R5: Workline Procurement & x402 Payment Service (Docker Containerized)
  # ============================================================================
  - type: web
    name: workline-procurement-service
    env: docker
    dockerfilePath: backend/r5/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10005
      - key: WORKLINE_ENV
        value: production
      - key: R5_SERVICE_TOKEN
        sync: false
      - key: R4_INTERNAL_URL
        value: http://workline-engineering-simulation:10004
      - key: R4_SERVICE_TOKEN
        sync: false
      - key: R3_INTERNAL_URL
        value: http://workline-knowledge-documents:10003
      - key: R3_SERVICE_TOKEN
        sync: false
      - key: WORKLINE_X402_ENABLED
        value: "true"
      - key: WORKLINE_X402_NETWORK
        value: base-sepolia
      - key: WORKLINE_X402_ASSET
        value: USDC
      - key: WORKLINE_X402_PAYMENT_ADDRESS
        sync: false
