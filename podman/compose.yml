version: '3.8'

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: workline-surrealdb
    restart: unless-stopped
    command: start --user ${WORKLINE_SURREALDB_USER:-root} --pass ${WORKLINE_SURREALDB_PASSWORD:-root} --bind 0.0.0.0:8000 file:/var/lib/surrealdb/data
    ports:
      - "${WORKLINE_SURREALDB_PORT:-8001}:8000"
    volumes:
      - surrealdb_data:/var/lib/surrealdb/data
    environment:
      - SURREAL_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: workline-qdrant
    restart: unless-stopped
    ports:
      - "${WORKLINE_QDRANT_HTTP_PORT:-6333}:6333"
      - "${WORKLINE_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  surrealdb_data:
    name: workline_surrealdb_data
  qdrant_data:
    name: workline_qdrant_data
