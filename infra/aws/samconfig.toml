version = 0.1
[default]
[default.deploy]
[default.deploy.parameters]
stack_name = "workline-platform-dev"
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket"
s3_prefix = "workline-platform-dev"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = "Environment=\"dev\""
image_repositories = []

[staging]
[staging.deploy.parameters]
stack_name = "workline-platform-staging"
s3_bucket = "workline-deployment-artifacts-staging"
s3_prefix = "workline-platform-staging"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = "Environment=\"staging\""

[production]
[production.deploy.parameters]
stack_name = "workline-platform-prod"
s3_bucket = "workline-deployment-artifacts-prod"
s3_prefix = "workline-platform-prod"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = "Environment=\"prod\""
